[package]
name = "blockchain-sim"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.9.1"
sha2 = "0.10.8"
secp256k1 = { version = "0.28.2", features = ["rand"] }
bs58 = "0.5.0"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "=4.5.4", features = ["derive"] }
rustyline = { version = "=13.0.0", default-features = false, features = ["with-file-history"] }
shell-words = "1.1.1"
strsim = "0.11.1"
unicode-segmentation = "=1.12.0"

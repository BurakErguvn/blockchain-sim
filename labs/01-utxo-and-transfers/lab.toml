objectives = [
  "Explain the UTXO model",
  "Identify transaction inputs, outputs, and change",
  "Observe how balances change only after confirmation",
]
aliases = ["Alice", "Bob", "Carol"]

[setup]
nodes = 3
difficulty = 1
